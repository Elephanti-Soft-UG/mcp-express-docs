name: Deploy to GitHub Pages
on:
    push:
        branches:
            - main
    # Fired by mcp-express-connectors' generate_registry.yaml after it publishes
    # an updated integrations registry to S3 from a push to its main branch, so
    # this site's build always reflects the latest registry/documentation.
    repository_dispatch:
        types:
            - connectors-registry-updated
jobs:
    build:
        name: Build Docusaurus
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Build website
              env:
                  INTEGRATIONS_S3_BUCKET: ${{ secrets.INTEGRATIONS_S3_BUCKET }}
                  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
              run: npm run build

            - name: Upload Build Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: build
    deploy:
        name: Deploy to GitHub Pages
        needs: build
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
